<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Triage</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header, footer { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: #141414; }
    header { border-bottom: 1px solid #2a2a2a; }
    footer { border-top: 1px solid #2a2a2a; overflow-x: auto; }
    #info { flex: 1; min-width: 0; }
    #name { font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #meta { font-size: .75rem; color: #888; }
    header label { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: #aaa; flex-shrink: 0; cursor: pointer; }
    button { font: inherit; color: #fff; background: #2a2a2a; border: none; border-radius: 8px; padding: 12px 16px; cursor: pointer; flex-shrink: 0; }
    button.primary { background: #3b82f6; }
    footer button { background: var(--c, #2a2a2a); }
    footer .on { box-shadow: inset 0 0 0 3px #fff; }
    footer #trash.on { background: #dc2626; }
    #row { flex: 1; min-height: 0; display: flex; position: relative; }
    aside { width: 320px; min-width: 160px; max-width: 90vw; resize: horizontal; overflow: auto; background: #111; border-right: 1px solid #2a2a2a; }
    #log { list-style: none; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: .75rem; line-height: 1.4; overflow-wrap: anywhere; }
    #log time { color: #888; font-variant-numeric: tabular-nums; margin-right: 6px; }
    #log button { padding: 4px 8px; margin-left: 6px; }
    @media (max-width: 700px) { aside { position: absolute; inset: 0 auto 0 0; z-index: 1; } }
    main { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; }
    main :is(img, video) { max-width: 100%; max-height: 100%; object-fit: contain; }
    main .arrow { position: absolute; top: 0; bottom: 0; width: 56px; background: transparent; border-radius: 0; font-size: 2rem; color: #fff8; }
    #prev { left: 0; } #next { right: 0; }
    #empty { text-align: center; color: #888; padding: 20px; line-height: 1.6; }
    dialog { margin: auto; width: min(96vw, 900px); max-height: 96dvh; background: #141414; color: #eee; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px; }
    dialog::backdrop { background: #000c; }
    dialog form { display: flex; flex-direction: column; gap: 12px; }
    .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
    figure { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    figure :is(img, video) { width: 100%; height: 40dvh; object-fit: contain; background: #000; border-radius: 8px; }
    figcaption { max-height: 30dvh; overflow: auto; font-size: .75rem; color: #aaa; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-line; }
    figcaption::first-line { color: #eee; font-weight: bold; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
    <div id="info"><div id="name">Photo Triage</div><div id="meta">Pick a folder to start</div></div>
    <label><input type="checkbox" id="autoplay" checked> Autoplay</label>
    <button id="logToggle" aria-label="Toggle log">Log</button>
    <button class="primary" id="pick">Open folder</button>
</header>
<div id="row">
<aside><ol id="log" aria-live="polite"></ol></aside>
<main>
    <div id="empty">
        <p>Photos and videos in the picked folder are shown one by one.<br>Subfolders become tags; 🗑 moves to <code>.trash</code>, undo from the log.<br>Exact duplicates are found in the background.</p>
        <p id="unsupported" hidden>⚠️ This browser can't open folders. Use Chrome.</p>
    </div>
    <img alt="" hidden>
    <video controls playsinline hidden></video>
    <button class="arrow" id="prev" hidden aria-label="Previous">‹</button>
    <button class="arrow" id="next" hidden aria-label="Next">›</button>
</main>
</div>
<footer id="bar" hidden></footer>
<dialog id="dupe">
    <form method="dialog">
        <p id="dupeTitle"></p>
        <div class="pair"></div>
        <button value="both" id="both">Keep both (rename this photo)</button>
        <button value="">Skip, decide later</button>
    </form>
</dialog>
<script type="module">
const IMG = /\.(jpe?g|png|gif|webp|avif|bmp|mp4|m4v|mov|webm)$/i, VID = /\.(mp4|m4v|mov|webm)$/i, TRASH = '.trash', AHEAD = 3, KEEP = 5;
const $ = s => document.querySelector(s);
const img = $('main img'), vid = $('main video'), bar = $('#bar'), dupe = $('#dupe');
let t0 = performance.now(), root, loading = '', photos = [], tags = [], shown = [], base = new Map(), i = 0, handles = new Map(), cache = new Map(), queue = Promise.resolve(), pending = 0;

// Autoplay setting, on unless turned off earlier.
const auto = $('#autoplay');
try { auto.checked = localStorage.getItem('swipe.autoplay') !== 'off'; } catch {}
vid.autoplay = auto.checked;
auto.onchange = () => {
    vid.autoplay = auto.checked;
    try { localStorage.setItem('swipe.autoplay', auto.checked ? 'on' : 'off'); } catch {}
};

if (!('showDirectoryPicker' in window)) $('#unsupported').hidden = false;

// Folder by path relative to root, like "Holidays" or ".trash/manual/_root"; created when missing.
const dir = path => {
    if (!path) return root;
    if (!handles.has(path)) {
        const k = path.lastIndexOf('/'), parent = k < 0 ? root : dir(path.slice(0, k));
        handles.set(path, Promise.resolve(parent).then(d => d.getDirectoryHandle(path.slice(k + 1), { create: true })));
    }
    return handles.get(path);
};
const where = loc => (loc.dir ? loc.dir + '/' : '') + loc.file;
// Every trash subfolder shows as the one 🗑 tag.
const tagOf = d => d.startsWith(TRASH) ? TRASH : d;
const photoAt = loc => photos.find(p => p.at.dir === loc.dir && p.at.file === loc.file);
const read = (d, name) => d.getFileHandle(name).then(h => h.getFile(), () => null);

// Splits same-size files into groups of identical content (as indexes), reading growing chunks
// so a whole video never sits in memory. Runs in a worker: keep it self-contained.
async function identical(files) {
    let groups = [files.map((_, k) => k)];
    for (let o = 0, c = 65536; o < files[0].size && groups.length; o += c, c = Math.min(c * 2, 8388608)) {
        const next = [];
        for (const g of groups) {
            const parts = [];
            for (const k of g) {
                const b = await files[k].slice(o, o + c).arrayBuffer().catch(() => null);
                if (!b) continue; // moved or deleted meanwhile
                // indexedDB.cmp compares binary keys byte by byte: a fast native equality check
                const part = parts.find(([pb]) => indexedDB.cmp(pb, b) === 0);
                part ? part[1].push(k) : parts.push([b, [k]]);
            }
            next.push(...parts.map(([, m]) => m).filter(m => m.length > 1));
        }
        groups = next;
    }
    return groups;
}

// Disk-heavy work goes to a few workers so the UI stays smooth; more would only make a disk seek.
const pool = Array.from({ length: Math.min(4, navigator.hardwareConcurrency || 2) }, () => new Worker(URL.createObjectURL(new Blob([
    `${identical}\n${exif}\n${taken}\nconst fns = { identical, taken };\nonmessage = async e => postMessage({ id: e.data.id, r: await fns[e.data.fn](e.data.arg).catch(() => null) });`,
], { type: 'text/javascript' }))));
const calls = new Map(); let seq = 0;
pool.forEach(w => w.onmessage = e => { calls.get(e.data.id)(e.data.r); calls.delete(e.data.id); });
const work = (fn, arg, w = pool[seq % pool.length]) => new Promise(resolve => { calls.set(++seq, resolve); w.postMessage({ id: seq, fn, arg }); });
// Runs fn over items in the workers, one job per worker at a time so the disk isn't flooded.
async function parallel(fn, items, live, label) {
    const out = []; let next = 0;
    await Promise.all(pool.map(async w => {
        while (next < items.length && live()) {
            const k = next++;
            if (k % 100 === 0) progress(`${label} ${k} / ${items.length}`);
            out[k] = await work(fn, items[k], w);
        }
    }));
    return out;
}
const same = async (a, b) => a.size === b.size && (await work('identical', [a, b]))?.length === 1;
// First name not taken in the folder: photo.jpg, photo_2.jpg, photo_3.jpg…
async function freeName(d, name) {
    const [, base, ext = ''] = name.match(/^(.*?)(\.[^.]*)?$/);
    for (let n = 1; ; n++) {
        const candidate = n === 1 ? name : `${base}_${n}${ext}`;
        if (!await read(d, candidate)) return candidate;
    }
}

// All EXIF tags of a JPEG (main, Exif and GPS sections) as { name: value }; unknown tags by hex id.
// Runs in a worker too: keep it self-contained.
async function exif(f) {
    const NAMES = {
        0x010F: 'Make', 0x0110: 'Model', 0x0112: 'Orientation', 0x011A: 'XResolution', 0x011B: 'YResolution', 0x0128: 'ResolutionUnit',
        0x0131: 'Software', 0x0132: 'DateTime', 0x013B: 'Artist', 0x0213: 'YCbCrPositioning', 0x8298: 'Copyright',
        0x829A: 'ExposureTime', 0x829D: 'FNumber', 0x8822: 'ExposureProgram', 0x8827: 'ISO', 0x9000: 'ExifVersion',
        0x9003: 'DateTimeOriginal', 0x9004: 'DateTimeDigitized', 0x9010: 'OffsetTime', 0x9011: 'OffsetTimeOriginal', 0x9012: 'OffsetTimeDigitized',
        0x9201: 'ShutterSpeedValue', 0x9202: 'ApertureValue', 0x9204: 'ExposureBiasValue', 0x9207: 'MeteringMode', 0x9209: 'Flash',
        0x920A: 'FocalLength', 0x927C: 'MakerNote', 0x9290: 'SubSecTime', 0x9291: 'SubSecTimeOriginal', 0xA001: 'ColorSpace',
        0xA002: 'PixelXDimension', 0xA003: 'PixelYDimension', 0xA402: 'ExposureMode', 0xA403: 'WhiteBalance', 0xA405: 'FocalLengthIn35mmFilm',
        0xA406: 'SceneCaptureType', 0xA420: 'ImageUniqueID', 0xA433: 'LensMake', 0xA434: 'LensModel',
    };
    const GPS = { 1: 'GPSLatitudeRef', 2: 'GPSLatitude', 3: 'GPSLongitudeRef', 4: 'GPSLongitude', 5: 'GPSAltitudeRef', 6: 'GPSAltitude', 7: 'GPSTimeStamp', 0x1D: 'GPSDateStamp' };
    const SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 }, out = {};
    try {
        const v = new DataView(await f.slice(0, 131072).arrayBuffer());
        if (v.getUint16(0) !== 0xFFD8) return out;
        for (let o = 2; v.getUint8(o) === 0xFF; o += 2 + v.getUint16(o + 2)) {
            if (v.getUint16(o) !== 0xFFE1 || v.getUint32(o + 4) !== 0x45786966) continue; // APP1 "Exif"
            const t = o + 10, le = v.getUint16(t) === 0x4949;
            const u16 = x => v.getUint16(t + x, le), u32 = x => v.getUint32(t + x, le), s32 = x => v.getInt32(t + x, le);
            const num = (type, x) => ({ 1: () => v.getUint8(t + x), 3: () => u16(x), 4: () => u32(x), 9: () => s32(x),
                5: () => `${u32(x)}/${u32(x + 4)}`, 10: () => `${s32(x)}/${s32(x + 4)}` })[type]?.();
            const ifd = (at, names) => {
                for (let k = 0; k < u16(at); k++) {
                    const e = at + 2 + k * 12, id = u16(e), type = u16(e + 2), n = u32(e + 4), len = (SIZE[type] ?? 1) * n, p = len > 4 ? u32(e + 8) : e + 8;
                    if (names === NAMES && id === 0x8769) ifd(u32(e + 8), NAMES);
                    else if (names === NAMES && id === 0x8825) ifd(u32(e + 8), GPS);
                    else out[names[id] ?? (names === GPS ? 'GPS ' : '') + '0x' + id.toString(16).padStart(4, '0')] =
                        type === 2 ? String.fromCharCode(...new Uint8Array(v.buffer, t + p, n)).replace(/\0+$/, '')
                        : n <= 4 && num(type, p) !== undefined ? Array.from({ length: n }, (_, j) => num(type, p + j * SIZE[type])).join(', ')
                        : `(${len} bytes)`;
                }
            };
            ifd(u32(4), NAMES);
            break;
        }
    } catch {} // cut off or broken EXIF: keep what was read
    return out;
}
// EXIF date taken, else last edit date, as "YYYY:MM:DD hh:mm:ss", or null. Runs in a worker.
async function taken(f) {
    const e = await exif(f);
    return e.DateTimeOriginal ?? e.DateTime ?? null;
}
// Same name, same color: hue from a string hash, mixed so similar names get distant hues.
const hue = s => {
    const h = [...s].reduce((h, c) => Math.imul(h, 31) + c.codePointAt(0) | 0, 0);
    return (Math.imul(h ^ h >>> 15, 0x2c1b3c6d) >>> 0) % 360;
};
const status = text => $('#meta').textContent = text;
const progress = text => { loading = text; ui(); };
const byName = (a, b) => a.localeCompare(b, undefined, { numeric: true });

// Log panel: in memory only, a fresh one per opened folder. Hidden by default on phones.
const aside = $('aside'), logList = $('#log');
aside.hidden = matchMedia('(max-width: 700px)').matches;
$('#logToggle').onclick = () => aside.hidden = !aside.hidden;
// Milliseconds as MM:SS.mmm
const stamp = ms => { ms = Math.round(ms); return `${String(Math.floor(ms / 60000)).padStart(2, '0')}:${(ms % 60000 / 1000).toFixed(3).padStart(6, '0')}`; };
const took = t => stamp(performance.now() - t);
function log(text, ...buttons) {
    const li = document.createElement('li'), atEnd = aside.scrollTop + aside.clientHeight >= aside.scrollHeight - 4;
    li.append(Object.assign(document.createElement('time'), { textContent: stamp(performance.now() - t0) }), text, ...buttons);
    logList.append(li);
    if (atEnd) aside.scrollTop = aside.scrollHeight;
}

async function pick() {
    try { root = await showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { if (e.name !== 'AbortError') alert(e.message); return; }
    t0 = performance.now(); logList.replaceChildren(); log(`opened folder "${root.name}"`);
    cache.forEach(u => u.then(URL.revokeObjectURL));
    photos = []; tags = []; base = new Map(); handles = new Map(); cache = new Map(); i = 0; progress('listing');
    const r = root;
    // Triage starts with the first photo found, in disk order; the background sorts them later.
    for await (const h of r.values()) {
        if (root !== r) return; // another folder got opened
        if (h.kind === 'file' && IMG.test(h.name)) {
            // dir: folder shown in the UI (updated instantly), at: where the file really is (updated by the background queue)
            photos.push({ name: h.name, idx: photos.length, dir: '', at: { dir: '', file: h.name }, pending: 0 });
            if (photos.length === 1) render();
            else if (photos.length % 100 === 0) progress(`listing ${photos.length}`);
        } else if (h.kind === 'directory' && !h.name.startsWith('.')) tags.push(h.name);
    }
    tags.sort(byName);
    log(`listed ${photos.length} photos and ${tags.length} folders in ${took(t0)}`);
    progress('');
    if (!photos.length) render();
    background(r);
}

// Runs while triage is already going: file info and folder counts, sort by modified date, then by EXIF date, then duplicates.
async function background(r) {
    const live = () => root === r; // stop when another folder gets opened

    // Snapshot of every media file with its size and dates, taken inside the move queue so no file is mid-move.
    let t = performance.now();
    const files = [];
    progress('reading file info');
    await exclusive(async () => {
        for (const p of photos) if (!p.at.dir) files.push({ dir: '', file: p.at.file });
        for (const d of tags) {
            if (!live()) return;
            let n = 0;
            for await (const h of (await dir(d)).values()) if (h.kind === 'file' && IMG.test(h.name)) { files.push({ dir: d, file: h.name }); n++; }
            base.set(d, n - photos.filter(p => p.at.dir === d).length); // our photos are counted by p.dir
        }
        for (let k = 0; k < files.length && live(); k += 100)
            await Promise.all(files.slice(k, k + 100).map(async e => e.f = await read(await dir(e.dir), e.file)));
    });
    if (!live()) return;
    const at = new Map(photos.map(p => [where(p.at), p]));
    for (const e of files) if (e.f && at.has(where(e))) Object.assign(at.get(where(e)), { f: e.f, time: e.f.lastModified });
    order();
    log(`read size and dates of ${files.length} files in ${took(t)}, sorted by modified date`);

    // Date taken from EXIF beats the modified date, which copying often resets.
    t = performance.now();
    const shots = photos.filter(p => p.f), dates = await parallel('taken', shots.map(p => p.f), live, 'reading EXIF');
    if (!live()) return;
    shots.forEach((p, k) => p.time = Date.parse(dates[k]?.replace(':', '-').replace(':', '-').replace(' ', 'T')) || p.time);
    order();
    log(`read EXIF of ${shots.length} photos in ${took(t)}, ${dates.filter(Boolean).length} have a date taken, sorted by it`);

    // Exact duplicates, whatever their names: only files of the same size can match, so only those are compared.
    t = performance.now();
    const groups = [...Map.groupBy(files.filter(e => e.f), e => e.f.size).values()].filter(g => g.length > 1);
    const found = await parallel('identical', groups.map(g => g.map(e => e.f)), live, 'finding duplicates');
    if (!live()) return;
    const sets = found.flatMap((r, k) => (r ?? []).map(set => set.map(j => groups[k][j])));
    log(`compared ${groups.reduce((n, g) => n + g.length, 0)} files of equal size in ${took(t)}, duplicate sets: ${sets.length}`);
    plan(sets);
    progress('');
}

// Sorts by p.time (modified date, later EXIF date taken), then name; stays on the current photo.
function order() {
    const cur = photos[i];
    photos.sort((a, b) => (a.time ?? 0) - (b.time ?? 0) || byName(a.name, b.name));
    photos.forEach((p, n) => p.idx = n);
    i = Math.max(0, photos.indexOf(cur));
    render();
}

// Reads the photo into memory once, so its URL keeps working after the file is moved.
function load(p) {
    if (!cache.has(p)) cache.set(p, (async () => {
        await p.busy;
        const f = await read(await dir(p.at.dir), p.at.file);
        // Videos are too big for memory: the URL points at the file and is dropped once the file moves.
        if (VID.test(p.name)) return URL.createObjectURL(f);
        const u = URL.createObjectURL(new Blob([await f.arrayBuffer()], { type: f.type }));
        const im = new Image(); im.src = u; await im.decode().catch(() => {});
        return u;
    })().catch(() => { cache.delete(p); return ''; }));
    return cache.get(p);
}

function button(label, on, onclick, id) {
    const b = document.createElement('button');
    b.textContent = label; b.className = on ? 'on' : ''; b.onclick = onclick;
    if (id) b.id = id;
    return b;
}

function ui() {
    const p = photos[i];
    img.hidden = vid.hidden = bar.hidden = $('#prev').hidden = $('#next').hidden = !p;
    $('#empty').hidden = !!p;
    if (!p) { $('#name').textContent = root?.name ?? 'Photo Triage'; status(root ? 'All sorted 🎉 No photos left in the root folder' : 'Pick a folder to start'); return; }
    $('#name').textContent = p.name;
    (VID.test(p.name) ? img : vid).hidden = true;
    status(`${i + 1} / ${photos.length}` + (p.dir ? ` · ${p.dir === TRASH ? 'trash' : p.dir}` : '') +
        ` · ${photos.filter(x => !x.dir).length} left` + (pending ? ` · saving ${pending}…` : '') + (loading ? ` · ${loading}…` : ''));
    // Most used tags first; sort is stable, so ties stay alphabetical.
    const count = new Map(base);
    for (const x of photos) count.set(x.dir, (count.get(x.dir) ?? 0) + 1);
    shown = tags.toSorted((a, b) => (count.get(b) ?? 0) - (count.get(a) ?? 0));
    bar.replaceChildren(
        button('🗑', p.dir === TRASH, () => move(TRASH), 'trash'),
        ...shown.map(t => {
            const b = button(t, p.dir === t, () => move(t));
            b.style.setProperty('--c', `hsl(${hue(t)} 55% 32%)`);
            return b;
        }),
        button('＋', false, addTag),
    );
}

async function render() {
    ui();
    const p = photos[i];
    if (photos[i]?.name !== vid.dataset.name) vid.pause();
    if (!p) return;
    for (const [q, u] of cache) if (Math.abs(q.idx - i) > KEEP) { cache.delete(q); u.then(URL.revokeObjectURL); }
    const u = await load(p);
    if (photos[i] === p) { // unless the user navigated away while loading
        if (!VID.test(p.name)) img.src = u;
        else if (vid.src !== u) { vid.src = u; vid.dataset.name = p.name; }
    }
    for (const q of photos.slice(i + 1, i + 1 + AHEAD)) load(q);
}

async function moveFile(src, from, dst, to) {
    const h = await src.getFileHandle(from);
    try { await h.move(dst, to); }
    catch { // move() unsupported here: copy, then delete the original only after the copy is written
        const w = await (await dst.getFileHandle(to, { create: true })).createWritable();
        await w.write(await h.getFile()); await w.close();
        await src.removeEntry(from);
    }
}

// Shows files side by side with all their metadata; resolves to the kept index ('0', '1'…), 'both' or '' (skip).
async function choose(title, items, both) {
    $('#dupeTitle').textContent = title;
    $('#both').hidden = !both;
    const urls = [];
    dupe.querySelector('.pair').replaceChildren(...await Promise.all(items.map(async ([label, f], n) => {
        const fig = document.createElement('figure'), cap = document.createElement('figcaption'), meta = await exif(f), u = URL.createObjectURL(f);
        const im = document.createElement(VID.test(f.name) ? 'video' : 'img');
        const show = () => cap.textContent = `${label}\n${(f.size / 1048576).toFixed(2)} MB · ${im.naturalWidth || im.videoWidth || '?'}×${im.naturalHeight || im.videoHeight || '?'}\nmodified ${new Date(f.lastModified).toLocaleString()}` +
            Object.entries(meta).map(([k, v]) => `\n${k}: ${v}`).join('');
        im.controls = im.muted = true; im.onload = im.onloadedmetadata = show; im.src = u; show(); urls.push(u);
        fig.append(im, cap, Object.assign(document.createElement('button'), { value: n, className: 'primary', textContent: 'Keep this one' }));
        return fig;
    })));
    dupe.returnValue = '';
    dupe.showModal();
    return new Promise(resolve => dupe.onclose = () => { urls.forEach(URL.revokeObjectURL); resolve(dupe.returnValue); });
}

// Trashes a duplicate after re-checking it still matches the copy that stays: files may have changed since the scan.
async function dropCopy(c, keep) {
    const [a, b] = await Promise.all([c, keep].map(async x => read(await dir(x.dir), x.file)));
    if (a && b && await same(a, b)) await trash(c, 'duplicates');
    else log(`skipped ${where(c)}: changed since the scan`);
}

// Copies spread over several folders: the user keeps one.
async function decide(kept) {
    const fresh = (await Promise.all(kept.map(async c => ({ ...c, f: await read(await dir(c.dir), c.file) })))).filter(c => c.f);
    if (fresh.length < 2) return log(`${kept[0].file}: only one copy left, nothing to decide`);
    const k = await choose(`Identical copies of "${kept[0].file}". Keep one, the others go to trash.`, fresh.map(c => [where(c), c.f]));
    if (k === '') return false;
    for (const c of fresh) if (c !== fresh[k]) await dropCopy(c, fresh[k]);
}

// Turns groups of identical files into log entries: root copies, then copies within one folder (the older stays), then per photo.
function plan(sets) {
    const older = (a, b) => a.f.lastModified - b.f.lastModified || byName(a.file, b.file), fromRoot = [], inFolder = [], spread = [];
    for (const g of sets) {
        const sub = g.filter(c => c.dir), kept = [];
        for (const list of Map.groupBy(sub.length ? sub : g, c => c.dir).values()) {
            list.sort(older); kept.push(list[0]);
            inFolder.push(...list.slice(1).map(c => [c, list[0]]));
        }
        if (sub.length) fromRoot.push(...g.filter(c => !c.dir).map(c => [c, kept[0]]));
        if (kept.length > 1) spread.push(kept);
    }
    const batch = (pairs, text) => pairs.length && log(text, once('Move to trash', () => task(async () => { for (const [c, k] of pairs) await dropCopy(c, k); })));
    batch(fromRoot, `${fromRoot.length} root photos have an identical copy in a subfolder`);
    batch(inFolder, `${inFolder.length} duplicates within the same folder (the older copy stays)`);
    for (const kept of spread) log(`${kept[0].file}: identical copies in ${kept.map(c => c.dir).join(', ')}`, once('Decide', () => task(() => decide(kept))));
}

// Moves a file into folder `to` (as name_2… when the name is taken) and keeps the photo there in sync.
async function put(from, to, name = from.file) {
    const dst = await dir(to), file = await freeName(dst, name), p = photoAt(from);
    await moveFile(await dir(from.dir), from.file, dst, file);
    const at = { dir: to, file };
    if (p) { p.at = at; if (!p.pending) settle(p); }
    else for (const [d, n] of [[from.dir, -1], [to, 1]]) if (base.has(d)) base.set(d, base.get(d) + n);
    return at;
}

// Moves a file to .trash/<kind>/<its folder>/ and logs it with an undo button.
async function trash(loc, kind) {
    const at = await put(loc, `${TRASH}/${kind}/${loc.dir || '_root'}`);
    log(`trashed ${where(loc)} → ${where(at)}`, once('Undo', () => task(async () => log(`restored ${where(await put(at, loc.dir, loc.file))}`))));
    return at;
}

// The real file operation, run in the background queue one at a time.
async function relocate(p, to) {
    const from = p.at;
    if (tagOf(from.dir) === to) return;
    if (to === TRASH) return trash(from, 'manual');
    const mine = await read(await dir(from.dir), from.file), there = { dir: to, file: p.name }, theirs = await read(await dir(to), p.name);
    if (!theirs) {
        await put(from, to, p.name);
        log(`moved ${where(from)} → ${to || 'root'}`);
    } else if (await same(mine, theirs)) {
        // shortcut: undoing this trash restores the file untracked (not shown until the folder is reopened), fine while rare
        await trash(from, 'duplicates'); // identical copy is already there
        p.at = there;
        if (base.has(to)) base.set(to, base.get(to) - 1); // ...and is now counted as this photo
    } else {
        const keep = await choose(`"${p.name}" already exists in ${to || 'the root folder'} with different content. Keep one (the other goes to trash) or both?`,
            [['This photo', mine], [`Already in ${to || 'root'}`, theirs]], true);
        if (keep === '0') { await trash(there, 'replaced'); await put(from, to, p.name); }
        else if (keep === '1') await trash(from, 'replaced');
        else if (keep === 'both') { const at = await put(from, to, p.name); log(`moved ${where(from)} → ${where(at)}`); }
    }
}

// Tapping the folder the photo is already in moves it back to the root.
function move(target) {
    const p = photos[i]; if (!p || dupe.open) return;
    const to = p.dir === target ? '' : target;
    if (to && to !== TRASH && !tags.includes(to)) tags.push(to);
    if (to && i < photos.length - 1) i++;
    enqueue(p, to);
    render();
}

// File work runs in one queue, one operation at a time.
const exclusive = fn => queue = queue.then(fn).catch(e => log(`⚠️ ${e.message}`));
function task(fn) {
    pending++; ui();
    return exclusive(fn).finally(() => { pending--; ui(); });
}
// Button that disables itself once clicked, unless the action resolves to false (skipped).
function once(label, fn) {
    const b = button(label, false, async () => { b.disabled = true; if (await fn() === false) b.disabled = false; });
    return b;
}

function enqueue(p, to) {
    p.dir = to; p.pending++;
    p.busy = task(() => relocate(p, to)
        .catch(e => { alert(`Moving "${p.name}" failed: ${e.message}`); throw new Error(`moving ${p.name} failed: ${e.message}`); })
        .finally(() => { p.pending--; settle(p); }));
}

// After a photo's file moved: show its real folder and drop a video URL pointing at the old place.
function settle(p) {
    if (!p.pending) p.dir = tagOf(p.at.dir);
    if (VID.test(p.name)) { cache.get(p)?.then(URL.revokeObjectURL); cache.delete(p); if (photos[i] === p) return render(); }
    ui();
}

function addTag() {
    const name = prompt('New folder name')?.replace(/[\\/:*?"<>|]/g, '').trim();
    if (!name || name.startsWith('.')) return;
    move(name);
}

function go(d) { const n = i + d; if (n >= 0 && n < photos.length) { i = n; render(); } }

$('#pick').onclick = pick;
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
let x0;
$('main').addEventListener('touchstart', e => x0 = e.changedTouches[0].screenX, { passive: true });
$('main').addEventListener('touchend', e => { const dx = e.changedTouches[0].screenX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('keydown', e => {
    if (dupe.open) return;
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'Delete' || e.key === 'Backspace') move(TRASH);
    else if (/^[1-9]$/.test(e.key) && shown[e.key - 1]) move(shown[e.key - 1]);
});
identical([new File(['ab'], 'a'), new File(['ab'], 'b'), new File(['ac'], 'c')]).then(g => console.assert(JSON.stringify(g) === '[[0,1]]', 'identical'));
console.assert(stamp(23417) === '00:23.417' && stamp(61000.4) === '01:01.000', 'stamp');
addEventListener('beforeunload', e => { if (pending) e.preventDefault(); }); // don't lose queued moves
</script>
</body>
