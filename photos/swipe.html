<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Triage</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header, footer { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: #141414; }
    header { border-bottom: 1px solid #2a2a2a; }
    footer { border-top: 1px solid #2a2a2a; overflow-x: auto; }
    #info { flex: 1; min-width: 0; }
    #name { font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #meta { font-size: .75rem; color: #888; }
    button { font: inherit; color: #fff; background: #2a2a2a; border: none; border-radius: 8px; padding: 12px 16px; cursor: pointer; flex-shrink: 0; }
    button.primary { background: #3b82f6; }
    footer .on { background: #16a34a; }
    footer #trash.on { background: #dc2626; }
    main { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
    main img { max-width: 100%; max-height: 100%; object-fit: contain; }
    main .arrow { position: absolute; top: 0; bottom: 0; width: 56px; background: transparent; border-radius: 0; font-size: 2rem; color: #fff8; }
    #prev { left: 0; } #next { right: 0; }
    #empty { text-align: center; color: #888; padding: 20px; line-height: 1.6; }
    dialog { margin: auto; width: min(96vw, 900px); max-height: 96dvh; background: #141414; color: #eee; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px; }
    dialog::backdrop { background: #000c; }
    dialog form { display: flex; flex-direction: column; gap: 12px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    figure { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    figure img { width: 100%; height: 40dvh; object-fit: contain; background: #000; border-radius: 8px; }
    figcaption { font-size: .75rem; color: #aaa; line-height: 1.4; overflow-wrap: anywhere; }
    figcaption b { color: #eee; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
    <div id="info"><div id="name">Photo Triage</div><div id="meta">Pick a folder to start</div></div>
    <button class="primary" id="pick">Open folder</button>
</header>
<main>
    <div id="empty">
        <p>Photos in the picked folder are shown one by one.<br>Subfolders become tags; 🗑 moves to <code>.trash</code>.</p>
        <p id="unsupported" hidden>⚠️ This browser can't open folders. Use Chrome.</p>
    </div>
    <img alt="" hidden>
    <button class="arrow" id="prev" hidden aria-label="Previous">‹</button>
    <button class="arrow" id="next" hidden aria-label="Next">›</button>
</main>
<footer id="bar" hidden></footer>
<dialog id="dupe">
    <form method="dialog">
        <p id="dupeTitle"></p>
        <div class="pair">
            <figure><img alt=""><figcaption></figcaption><button value="mine" class="primary">Keep this one</button></figure>
            <figure><img alt=""><figcaption></figcaption><button value="theirs" class="primary">Keep this one</button></figure>
        </div>
        <button value="">Keep both, skip</button>
    </form>
</dialog>
<script type="module">
const IMG = /\.(jpe?g|png|gif|webp|avif|bmp)$/i, TRASH = '.trash';
const $ = s => document.querySelector(s);
const img = $('main img'), bar = $('#bar'), dupe = $('#dupe');
let root, photos = [], tags = [], i = 0, url;

if (!('showDirectoryPicker' in window)) $('#unsupported').hidden = false;

const dir = name => name ? root.getDirectoryHandle(name, { create: true }) : root;
const read = (d, name) => d.getFileHandle(name).then(h => h.getFile(), () => null);
// indexedDB.cmp compares binary keys byte by byte: a fast native equality check
const same = async (a, b) => a.size === b.size && indexedDB.cmp(await a.arrayBuffer(), await b.arrayBuffer()) === 0;
const freeName = async (d, name) => await read(d, name) ? `${Date.now()}-${name}` : name;
const status = text => $('#meta').textContent = text;

async function pick() {
    try { root = await showDirectoryPicker({ mode: 'readwrite' }); }
    catch (e) { if (e.name !== 'AbortError') alert(e.message); return; }
    photos = []; tags = [];
    const dirs = [];
    for await (const h of root.values()) {
        if (h.kind === 'file' && IMG.test(h.name)) photos.push({ name: h.name, file: h.name, dir: '' });
        else if (h.kind === 'directory') { dirs.push(h); if (!h.name.startsWith('.')) tags.push(h.name); }
    }
    const byName = (a, b) => a.localeCompare(b, undefined, { numeric: true });
    photos.sort((a, b) => byName(a.name, b.name)); tags.sort(byName);

    // Root photos with an identical copy in a subfolder were already sorted (e.g. copied there earlier).
    const sorted = [];
    for (const [n, p] of photos.entries()) {
        status(`Checking for already sorted photos… ${n + 1} / ${photos.length}`);
        const mine = await read(root, p.name);
        for (const d of dirs) {
            const theirs = await read(d, p.name);
            if (theirs && await same(mine, theirs)) { sorted.push(p); break; }
        }
    }
    if (sorted.length && confirm(`${sorted.length} of ${photos.length} photos in the root already have an identical copy in a subfolder. Remove these root copies?`)) {
        for (const p of sorted) await root.removeEntry(p.name);
        photos = photos.filter(p => !sorted.includes(p));
    }
    i = 0; render();
}

function button(label, on, onclick, id) {
    const b = document.createElement('button');
    b.textContent = label; b.className = on ? 'on' : ''; b.onclick = onclick;
    if (id) b.id = id;
    return b;
}

async function render() {
    const p = photos[i];
    img.hidden = bar.hidden = $('#prev').hidden = $('#next').hidden = !p;
    $('#empty').hidden = !!p;
    if (!p) { $('#name').textContent = root?.name ?? 'Photo Triage'; status(root ? 'All sorted 🎉 No photos left in the root folder' : 'Pick a folder to start'); return; }
    $('#name').textContent = p.name;
    status(`${i + 1} / ${photos.length}` + (p.dir ? ` · ${p.dir === TRASH ? 'trash' : p.dir}` : '') + ` · ${photos.filter(x => !x.dir).length} left`);
    bar.replaceChildren(
        button('🗑', p.dir === TRASH, () => move(TRASH), 'trash'),
        ...tags.map(t => button(t, p.dir === t, () => move(t))),
        button('＋', false, addTag),
    );
    const file = await read(await dir(p.dir), p.file);
    if (photos[i] !== p) return; // user navigated away while loading
    URL.revokeObjectURL(url);
    img.src = url = URL.createObjectURL(file);
}

async function moveFile(src, from, dst, to) {
    const h = await src.getFileHandle(from);
    try { await h.move(dst, to); }
    catch { // move() unsupported here: copy, then delete the original only after the copy is written
        const w = await (await dst.getFileHandle(to, { create: true })).createWritable();
        await w.write(await h.getFile()); await w.close();
        await src.removeEntry(from);
    }
}

// Shows both versions; resolves to 'mine', 'theirs' or '' (keep both).
function choose(mine, theirs, folder) {
    $('#dupeTitle').textContent = `"${mine.name}" already exists in ${folder || 'the root folder'} with different content. Which one to keep? The other goes to trash.`;
    const urls = [mine, theirs].map((f, n) => {
        const fig = dupe.querySelectorAll('figure')[n], im = fig.querySelector('img'), u = URL.createObjectURL(f);
        const cap = () => fig.querySelector('figcaption').innerHTML =
            `<b>${n ? 'Already in ' + (folder || 'root') : 'This photo'}</b><br>${(f.size / 1048576).toFixed(2)} MB · ${im.naturalWidth || '?'}×${im.naturalHeight || '?'}<br>modified ${new Date(f.lastModified).toLocaleString()}`;
        im.onload = cap; im.src = u; cap();
        return u;
    });
    dupe.returnValue = '';
    dupe.showModal();
    return new Promise(resolve => dupe.onclose = () => { urls.forEach(URL.revokeObjectURL); resolve(dupe.returnValue); });
}

// Tapping the folder the photo is already in moves it back to the root.
async function move(target) {
    const p = photos[i]; if (!p) return;
    const to = p.dir === target ? '' : target;
    try {
        const src = await dir(p.dir), dst = await dir(to), trash = await dir(TRASH);
        const mine = await read(src, p.file), theirs = await read(dst, p.name);
        if (to === TRASH || !theirs) {
            const as = to === TRASH ? await freeName(trash, p.name) : p.name;
            await moveFile(src, p.file, dst, as);
            Object.assign(p, { dir: to, file: as });
        } else if (await same(mine, theirs)) {
            await src.removeEntry(p.file); // identical copy is already there
            Object.assign(p, { dir: to, file: p.name });
        } else {
            const keep = await choose(mine, theirs, to);
            if (keep === 'mine') {
                await moveFile(dst, p.name, trash, await freeName(trash, p.name));
                await moveFile(src, p.file, dst, p.name);
                Object.assign(p, { dir: to, file: p.name });
            } else if (keep === 'theirs') {
                const as = await freeName(trash, p.name);
                await moveFile(src, p.file, trash, as);
                Object.assign(p, { dir: TRASH, file: as });
            }
        }
        if (to && !tags.includes(to) && to !== TRASH) tags.push(to);
        if (to && i < photos.length - 1) i++;
        render();
    } catch (e) { alert('Move failed: ' + e.message); }
}

function addTag() {
    const name = prompt('New folder name')?.replace(/[\\/:*?"<>|]/g, '').trim();
    if (!name || name.startsWith('.')) return;
    move(name);
}

function go(d) { const n = i + d; if (n >= 0 && n < photos.length) { i = n; render(); } }

$('#pick').onclick = pick;
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
let x0;
$('main').addEventListener('touchstart', e => x0 = e.changedTouches[0].screenX, { passive: true });
$('main').addEventListener('touchend', e => { const dx = e.changedTouches[0].screenX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('keydown', e => {
    if (dupe.open) return;
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'Delete' || e.key === 'Backspace') move(TRASH);
    else if (/^[1-9]$/.test(e.key) && tags[e.key - 1]) move(tags[e.key - 1]);
});
</script>
</body>
</html>
